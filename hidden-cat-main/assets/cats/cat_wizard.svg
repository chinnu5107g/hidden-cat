<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b388ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
  </defs>
  <!-- Aura -->
  <circle cx="50" cy="50" r="46" fill="url(#catGlow)"/>
  <!-- Body/Head -->
  <ellipse cx="50" cy="62" rx="28" ry="24" fill="#13111c"/>
  <!-- Ears -->
  <polygon points="26,45 32,22 44,38" fill="#181524"/>
  <polygon points="29,43 34,26 42,38" fill="#d154bc" opacity="0.6"/>
  <polygon points="74,45 68,22 56,38" fill="#181524"/>
  <polygon points="71,43 66,26 58,38" fill="#d154bc" opacity="0.6"/>
  <!-- Wizard Hat -->
  <path d="M 22,36 Q 50,28 78,36 Q 50,30 22,36 Z" fill="#311b92"/>
  <path d="M 30,34 Q 50,6 64,10 Q 52,24 70,34 Z" fill="url(#hatGrad)"/>
  <path d="M 30,34 Q 50,29 70,34" stroke="#ffd700" stroke-width="2.5" fill="none"/>
  <!-- Crescent Moon on Hat -->
  <path d="M 52,18 A 5,5 0 1 1 48,26 A 4,4 0 1 0 52,18 Z" fill="#ffe082"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="58" rx="7.5" ry="9" fill="url(#eyeGrad)"/>
  <ellipse cx="62" cy="58" rx="7.5" ry="9" fill="url(#eyeGrad)"/>
  <ellipse cx="38" cy="58" rx="3.5" ry="7.5" fill="#110d1c"/>
  <ellipse cx="62" cy="58" rx="3.5" ry="7.5" fill="#110d1c"/>
  <!-- Eye highlights -->
  <circle cx="36" cy="54" r="2.2" fill="#ffffff"/>
  <circle cx="40" cy="61" r="1.1" fill="#ffffff"/>
  <circle cx="60" cy="54" r="2.2" fill="#ffffff"/>
  <circle cx="64" cy="61" r="1.1" fill="#ffffff"/>
  <!-- Cute Nose -->
  <polygon points="50,65 47,68 53,68" fill="#ff80ab"/>
  <!-- Mouth -->
  <path d="M 47,70 Q 50,73 53,70" stroke="#ff80ab" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <path d="M 25,64 Q 15,62 8,63" stroke="#b388ff" stroke-width="1.4" fill="none" opacity="0.75"/>
  <path d="M 26,68 Q 16,70 9,74" stroke="#b388ff" stroke-width="1.4" fill="none" opacity="0.75"/>
  <path d="M 75,64 Q 85,62 92,63" stroke="#b388ff" stroke-width="1.4" fill="none" opacity="0.75"/>
  <path d="M 74,68 Q 84,70 91,74" stroke="#b388ff" stroke-width="1.4" fill="none" opacity="0.75"/>
  <!-- Paws holding edge -->
  <ellipse cx="34" cy="80" rx="6" ry="5" fill="#252136"/>
  <ellipse cx="66" cy="80" rx="6" ry="5" fill="#252136"/>
  <circle cx="34" cy="80" r="2.5" fill="#d154bc" opacity="0.8"/>
  <circle cx="66" cy="80" r="2.5" fill="#d154bc" opacity="0.8"/>
</svg>
